<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発注書 送り状振り分けメモ作成ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f5f5; color: #333; font-size: 14px; }
  .container { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 16px; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 12px; }

  .api-section { background: #fff; border: 1px solid #ccc; padding: 12px; margin-bottom: 12px; border-radius: 4px; }
  .api-section label { font-size: 13px; font-weight: bold; }
  .api-section input { font-size: 13px; padding: 4px 8px; border: 1px solid #aaa; border-radius: 3px; width: 360px; margin-left: 8px; }
  .api-section .status { font-size: 12px; margin-left: 8px; }
  .api-section .saved { color: #080; }
  .api-section .unsaved { color: #c00; }

  .drop-zone { border: 2px dashed #999; border-radius: 6px; padding: 28px; text-align: center; background: #fafafa; cursor: pointer; margin-bottom: 12px; transition: border-color 0.2s, background 0.2s; }
  .drop-zone.dragover { border-color: #1a73e8; background: #e8f0fe; }
  .drop-zone.has-file { border-color: #080; border-style: solid; background: #f0fff0; }
  .drop-zone p { font-size: 14px; color: #666; }
  .drop-zone .filename { font-size: 14px; color: #333; font-weight: bold; margin-top: 6px; }

  .run-area { text-align: center; margin-bottom: 16px; }
  .run-btn { font-size: 15px; padding: 10px 40px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .run-btn:hover { background: #1557b0; }
  .run-btn:disabled { background: #aaa; cursor: default; }

  .loading { text-align: center; padding: 24px; font-size: 14px; color: #666; }
  .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { background: #fdecea; border: 1px solid #f5c6cb; color: #721c24; padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; }
  .info-msg { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; }

  .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .output-header h2 { font-size: 14px; font-weight: bold; }
  .print-note { font-size: 11px; color: #888; margin-bottom: 8px; }

  .factory-memo { background: #fff; border: 2px solid #333; padding: 16px; margin-bottom: 16px; }
  .factory-memo-content { font-family: 'Meiryo', monospace; font-size: 13px; line-height: 1.8; white-space: pre-wrap; outline: none; min-height: 100px; }

  .email-output { background: #fff; border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; border-radius: 4px; }
  .email-output pre { background: #f4f4f4; border: 1px solid #ddd; padding: 12px; font-family: 'Meiryo', monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.7; }

  /* 修正指示エリア */
  .edit-section { background: #fff; border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; border-radius: 4px; }
  .edit-section h2 { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  .edit-section textarea { width: 100%; font-family: 'Meiryo', sans-serif; font-size: 13px; padding: 8px; border: 1px solid #aaa; border-radius: 3px; resize: vertical; min-height: 50px; max-height: 120px; }
  .edit-section .edit-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .edit-section .char-count { font-size: 11px; color: #888; }
  .edit-section .edit-count { font-size: 11px; color: #888; }
  .edit-btn { font-size: 13px; padding: 6px 20px; background: #333; color: #fff; border: none; border-radius: 3px; cursor: pointer; }
  .edit-btn:hover { background: #555; }
  .edit-btn:disabled { background: #aaa; cursor: default; }
  .edit-examples { font-size: 11px; color: #999; margin-top: 4px; }

  button { font-size: 13px; padding: 5px 14px; border: 1px solid #666; border-radius: 3px; cursor: pointer; background: #fff; }
  button:hover { background: #eee; }
  button.primary { background: #333; color: #fff; border-color: #333; }
  button.primary:hover { background: #555; }
  button.copy-btn { background: #1a73e8; color: #fff; border-color: #1a73e8; font-size: 12px; padding: 3px 10px; }
  button.copy-btn:hover { background: #1557b0; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .factory-memo { border: 1px solid #000; }
    .factory-memo-content { font-size: 12px; }
    .container { max-width: 100%; padding: 8px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1 class="no-print">発注書 送り状振り分けメモ作成ツール</h1>

  <div class="api-section no-print">
    <label>APIキー：</label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <button onclick="saveApiKey()">保存</button>
    <span id="apiStatus" class="status"></span>
  </div>

  <div class="drop-zone no-print" id="dropZone">
    <p>📄 発注書PDFをここにドラッグ＆ドロップ<br>またはクリックして選択</p>
    <div class="filename" id="fileName"></div>
    <input type="file" id="fileInput" accept=".pdf" style="display:none;">
  </div>

  <div class="run-area no-print">
    <button class="run-btn" id="runBtn" onclick="run()" disabled>実行</button>
  </div>

  <div class="loading no-print" id="loading" style="display:none;">
    <span class="spinner"></span>PDFを解析中...
  </div>
  <div class="loading no-print" id="editLoading" style="display:none;">
    <span class="spinner"></span>修正中...
  </div>

  <div class="error no-print" id="errorArea" style="display:none;"></div>
  <div class="info-msg no-print" id="infoArea" style="display:none;"></div>

  <div id="outputArea" style="display:none;">
    <div class="output-header no-print">
      <h2>📋 工場用メモ（この枠内が印刷されます）</h2>
      <button class="primary" onclick="window.print()">印刷</button>
    </div>
    <div class="print-note no-print">※ 内容を直接編集できます。編集後に印刷してください。</div>
    <div class="factory-memo">
      <div class="factory-memo-content" id="factoryMemo" contenteditable="true"></div>
    </div>

    <div class="no-print">
      <div class="output-header">
        <h2>✉️ メール用テキスト</h2>
        <button class="copy-btn" onclick="copyEmail()">コピー</button>
      </div>
      <div class="email-output">
        <pre id="emailText"></pre>
      </div>
    </div>

    <!-- 修正指示 -->
    <div class="edit-section no-print" id="editSection">
      <h2>🔧 修正指示</h2>
      <textarea id="editInput" placeholder="例：詰替用24㌜を14㌜と10㌜に分納して" maxlength="200" oninput="updateCharCount()"></textarea>
      <div class="edit-examples">例：「詰替用24㌜を14㌜と10㌜に分納」「出荷日を5月26日に変更」「ハセロジ分の60mlを800個に変更」</div>
      <div class="edit-footer">
        <span class="char-count" id="charCount">0/200文字</span>
        <span class="edit-count" id="editCount">修正回数：0/5</span>
        <button class="edit-btn" id="editBtn" onclick="submitEdit()">修正実行</button>
      </div>
    </div>
  </div>
</div>

<script>
let pendingPdfBase64 = null;
let editCounter = 0;
const MAX_EDITS = 5;

// ─── APIキー ───
function loadApiKey() {
  const key = localStorage.getItem('anthropic_api_key') || '';
  document.getElementById('apiKey').value = key;
  updateApiStatus();
}
function saveApiKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  localStorage.setItem('anthropic_api_key', key);
  updateApiStatus();
}
function updateApiStatus() {
  const key = document.getElementById('apiKey').value.trim() || localStorage.getItem('anthropic_api_key') || '';
  const st = document.getElementById('apiStatus');
  if (key) { st.textContent = '✔ 保存済み'; st.className = 'status saved'; }
  else { st.textContent = '未設定'; st.className = 'status unsaved'; }
}
function getApiKey() {
  return document.getElementById('apiKey').value.trim() || localStorage.getItem('anthropic_api_key') || '';
}

// ─── ドラッグ＆ドロップ ───
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') loadFile(file);
  else showError('PDFファイルを選択してください。');
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

async function loadFile(file) {
  document.getElementById('fileName').textContent = '📎 ' + file.name;
  dropZone.classList.add('has-file');
  hideError(); hideInfo();
  try {
    pendingPdfBase64 = await fileToBase64(file);
    document.getElementById('runBtn').disabled = false;
  } catch (err) {
    showError('ファイル読み込みに失敗しました。');
    pendingPdfBase64 = null;
    document.getElementById('runBtn').disabled = true;
  }
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('読み込み失敗'));
    reader.readAsDataURL(file);
  });
}

// ─── 実行 ───
async function run() {
  if (!pendingPdfBase64) { showError('PDFを先に選択してください。'); return; }
  const apiKey = getApiKey();
  if (!apiKey) { showError('APIキーを設定してください。'); return; }
  showLoading('loading', true);
  hideError(); hideInfo();
  document.getElementById('outputArea').style.display = 'none';
  document.getElementById('runBtn').disabled = true;
  editCounter = 0;
  updateEditCount();
  try {
    const result = await callClaudeAPI(apiKey, pendingPdfBase64);
    renderOutput(result);
  } catch (err) {
    showError('エラー：' + err.message);
  } finally {
    showLoading('loading', false);
    document.getElementById('runBtn').disabled = false;
  }
}

// ─── Claude API（PDF解析） ───
async function callClaudeAPI(apiKey, pdfBase64) {
  const systemPrompt = `あなたは株式会社シーク静岡工場の出荷業務を支援するアシスタントです。
ラムズマークス株式会社からの発注書PDFを解析し、出荷メモ生成用のデータを抽出します。

## 発注書の構造
1. ヘッダー：発注書No、日付、発注元（ラムズマークス）、合計金額
2. 製品明細：納期、品名、入数（ケース入数）、CS数、数量、単価（税抜）、金額（税抜）
3. 小計・消費税・合計
4. 振り分けテーブル：各納品先への品名・数量・CS数・住所
   - ラムズマークス（本社）
   - ハセガワロジスティクス（倉庫）
   - 楽天市場RSL用
   - Amazon FBA用
   ※全納品先が毎回あるとは限らない

## 判定ルール
- 「（仮）発注書」「仮発注書」で振り分け情報がない → "KARI" とだけ返す
- 数量0の納品先は除外
- Amazon FBA用も全品0なら除外
- 納期が「最短」→ そのまま「最短」
- CS数が端数 → 切り上げ整数に。元値はcs_rawに残す

## 備考の扱い
「納品書はラムズマークス本社へ送付ください」「外箱に商品名・数量を必ず記入して下さい」等の定型指示文は備考に含めない。資材納品予定など実質的な情報のみ。該当なしなら空文字。

## 出荷形態
- ハセガワロジスティクス → "pallet"
- ラムズマークス本社 → "box"
- 楽天RSL → "pallet"
- Amazon FBA用 → 納品先がラムズマークスなら "box"、ハセロジなら "pallet"

## 概算重量とパレット分割ルール
製品の概算重量は以下で計算する（製品マスタは持たないため概算）：
- 1個あたり概算重量 = 容量(ml) × 1.1(比重) + 容器20g
  ※パウチ・詰替用も同じ計算でよい
- 1㌜あたり概算重量 = 1個あたり重量 × ケース入数 + 段ボール500g
- 納品先ごとの概算総重量 = 各品目の㌜重量 × ㌜数の合計

パレット出荷の納品先で概算総重量が約240kgを超える場合：
- その納品先のdestinationsを複数に分割する
- 分割は品目単位で行う（1品目を途中で割らない）
- 各パレットが240kg以下になるよう振り分ける
- 分割した場合、nameは同じだが「パレット①」「パレット②」等を末尾に付ける
- 各分割先にestimated_weight_kgを付与する（概算総重量を小数1桁で）
- 240kgを多少（十数kg程度）超える場合は分割不要

バラ箱（box）の納品先は重量による分割は不要。

## Amazon FBA用
- 形態が特殊（OPP、シュリンク○本組、セット組等）→ formに必ず記載
- 手数料は別計算 → fba_feeに税込金額

## 出力：JSON形式のみ。前置き・バッククォート不要。
{
  "po_number": "発注書No",
  "order_date": "注文日/発注日",
  "delivery_date": "納期（全品共通なら。複数なら代表的日付）",
  "client": "ラムズマークス株式会社",
  "subtotal": 税抜小計,
  "tax": 消費税額,
  "total_with_tax": 税込合計,
  "products": [
    {
      "name": "品名",
      "quantity": 総数量,
      "unit_price": 税抜単価,
      "amount": 税抜金額,
      "case_count": ケース入数(1ケース何個入りか。不明ならnull),
      "cs": CS数
    }
  ],
  "destinations": [
    {
      "name": "納品先正式名称",
      "label": "ラムズマークス" or "ハセガワロジスティクス" or "楽天RSL" or "Amazon FBA",
      "address": "住所",
      "tel": "電話番号",
      "contact": "担当者（あれば）",
      "shipping_type": "pallet" or "box",
      "estimated_weight_kg": 概算総重量(小数1桁。計算できない場合はnull),
      "items": [
        {
          "name": "品名",
          "form": "形態（OPP等。通常なら空文字）",
          "quantity": 数量,
          "case_count": ケース入数(不明ならnull),
          "cs": CS数(切り上げ整数),
          "cs_raw": 元のCS数
        }
      ]
    }
  ],
  "notes": "備考（定型指示文除外。なければ空文字）",
  "fba_fee": FBA手数料税込(なければ0)
}`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: [
          { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 } },
          { type: 'text', text: 'この発注書PDFを解析し、指定のJSON形式で出力してください。' }
        ]
      }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || 'HTTP ' + response.status);
  }

  const data = await response.json();
  const text = data.content.map(c => c.text || '').join('');
  const cleaned = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  if (cleaned === 'KARI') {
    throw new Error('仮発注書のため振り分け情報がありません。本発注書をアップロードしてください。');
  }
  return JSON.parse(cleaned);
}

// ─── 修正指示API ───
async function callEditAPI(apiKey, factoryText, emailText, instruction) {
  const systemPrompt = `あなたは出荷メモの修正専用アシスタントです。
出荷メモの内容修正のみ対応します。

## 対応する修正の例
- 分納指示（「○㌜を△㌜と□㌜に分ける」）
- 数量変更（「○○を800個に変更」）
- 出荷日・到着日の変更
- ロットの記入
- 送り状番号の記入
- 納品先の追加・削除
- その他、出荷メモに関する修正

## 対応しないもの
出荷メモと無関係な質問・雑談・調べもの → 即座に "REJECT" とだけ返してください。

## 保険入力の計算ルール（必ず守ること）
保険金額は送り状単位で計算する。
1. その送り状に含まれる全商品の（税抜単価 × 数量）を合計
2. 合計 × 1.1 で税込にする
3. 万円単位に切り上げ（1万円未満の端数は切り上げ）
4. 最低5（5万円）
5. 表記は [数字] のみ。金額詳細は書かない。

## 出荷日ルール
- 出荷日 = 納品日（到着日）の前日
- 月曜納品 → 金曜出荷（土日を避ける）

## 概算重量ルール
- 1個あたり概算 = 容量(ml) × 1.1(比重) + 容器20g
- 1㌜あたり概算 = 1個あたり × ケース入数 + 段ボール500g
- パレット分割の目安は約240kg（多少の超過は許容）
- 分割時は品目単位で分ける（1品目を途中で割らない）
- 分割した場合「パレット①」「パレット②」等を名称に付ける
- 概算重量は「重量：＿＿＿＿ kg（概算 ○○kg）」の形で記載

## 出力形式
修正後の工場用メモとメール用テキストを以下の形式で返してください。
前置き不要。

===FACTORY===
（工場用メモのテキスト全文）
===EMAIL===
（メール用テキストの全文）

フォーマットは入力されたものを維持してください。`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: '【現在の工場用メモ】\n' + factoryText + '\n\n【現在のメール用テキスト】\n' + emailText + '\n\n【修正指示】\n' + instruction
      }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || 'HTTP ' + response.status);
  }

  const data = await response.json();
  return data.content.map(c => c.text || '').join('');
}

// ─── 修正実行 ───
async function submitEdit() {
  const input = document.getElementById('editInput').value.trim();
  if (!input) { showError('修正内容を入力してください。'); return; }
  if (input.length > 200) { showError('200文字以内で入力してください。'); return; }
  if (editCounter >= MAX_EDITS) { showError('修正回数の上限（' + MAX_EDITS + '回）に達しました。再度PDFから生成してください。'); return; }

  const apiKey = getApiKey();
  if (!apiKey) { showError('APIキーを設定してください。'); return; }

  const factoryText = document.getElementById('factoryMemo').innerText;
  const emailText = document.getElementById('emailText').textContent;

  hideError(); hideInfo();
  showLoading('editLoading', true);
  document.getElementById('editBtn').disabled = true;

  try {
    const result = await callEditAPI(apiKey, factoryText, emailText, input);

    if (result.trim() === 'REJECT') {
      showInfo('出荷メモと関係のない入力のため、処理しませんでした。');
      return;
    }

    // ===FACTORY=== と ===EMAIL=== で分割
    const factoryMatch = result.match(/===FACTORY===([\s\S]*?)===EMAIL===/);
    const emailMatch = result.match(/===EMAIL===([\s\S]*?)$/);

    if (factoryMatch && emailMatch) {
      document.getElementById('factoryMemo').innerText = factoryMatch[1].trim();
      document.getElementById('emailText').textContent = emailMatch[1].trim();
      editCounter++;
      updateEditCount();
      document.getElementById('editInput').value = '';
      updateCharCount();
      showInfo('修正を反映しました。');
    } else {
      showError('修正結果の解析に失敗しました。手動で編集してください。');
    }
  } catch (err) {
    showError('修正エラー：' + err.message);
  } finally {
    showLoading('editLoading', false);
    document.getElementById('editBtn').disabled = false;
  }
}

// ─── 保険金額計算 ───
function calcInsurance(taxExclAmount) {
  const taxIncl = Math.round(taxExclAmount * 1.1);
  let man = Math.ceil(taxIncl / 10000);
  if (man < 5) man = 5;
  return man;
}

// ─── 出荷日計算 ───
function calcShipDate(delivDateStr) {
  if (!delivDateStr || delivDateStr === '最短') return null;
  let m, d;
  const match1 = delivDateStr.match(/(\d+)月(\d+)日/);
  const match2 = delivDateStr.match(/(\d{4})\/(\d+)\/(\d+)/);
  if (match1) { m = parseInt(match1[1]); d = parseInt(match1[2]); }
  else if (match2) { m = parseInt(match2[2]); d = parseInt(match2[3]); }
  else return null;
  const year = new Date().getFullYear();
  const delivDt = new Date(year, m - 1, d);
  let shipDt = new Date(delivDt);
  shipDt.setDate(shipDt.getDate() - 1);
  if (shipDt.getDay() === 0) shipDt.setDate(shipDt.getDate() - 2);
  if (shipDt.getDay() === 6) shipDt.setDate(shipDt.getDate() - 1);
  return (shipDt.getMonth() + 1) + '月' + shipDt.getDate() + '日';
}

// ─── 出力生成 ───
function renderOutput(data) {
  const delivDate = data.delivery_date || '＿月＿日';
  const shipDateStr = calcShipDate(delivDate);

  // ── 工場用メモ ──
  let f = '';
  f += '━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
  f += '出荷メモ　' + data.client + '\n';
  f += '発注書No：' + data.po_number + '\n';
  f += '納期：' + delivDate + '\n';
  f += '━━━━━━━━━━━━━━━━━━━━━━━━━━\n';

  data.destinations.forEach(dest => {
    let destTaxExcl = 0;
    dest.items.forEach(item => {
      const master = data.products.find(p => p.name === item.name);
      const unitPrice = master ? master.unit_price : 0;
      destTaxExcl += unitPrice * item.quantity;
    });
    const insurance = calcInsurance(destTaxExcl);
    const totalCs = dest.items.reduce((s, it) => s + (parseFloat(it.cs) || 0), 0);
    const totalCsCeil = Math.ceil(totalCs);
    const shipType = dest.shipping_type === 'pallet' ? 'パレット' : 'バラ';

    f += '\n──────────────────────────\n';
    f += '【' + dest.name + '】（' + shipType + '）\n';
    if (dest.address) f += dest.address + '\n';
    if (dest.contact) f += dest.contact + '\n';
    f += '──────────────────────────\n';
    f += '出荷日：' + (shipDateStr || '＿＿月＿＿日') + '　→　到着日：' + delivDate + '\n\n';

    dest.items.forEach(item => {
      const formStr = item.form ? '（' + item.form + '）' : '';
      let csDetail = '';
      if (item.case_count && item.cs) {
        csDetail = '（' + item.case_count + '入×' + item.cs + '㌜）';
      } else if (item.cs) {
        csDetail = '（' + item.cs + '㌜）';
      }
      f += '　' + item.name + formStr + '　' + item.quantity + '個' + csDetail + '\n';
      f += '　　lot：＿＿＿＿＿＿\n';
    });

    f += '\n';
    if (dest.shipping_type === 'pallet') {
      f += '個口：＿＿（' + totalCsCeil + '㌜）(' + shipType + ')\n';
    } else {
      f += '個口：' + totalCsCeil + 'ケース(' + shipType + ')\n';
    }
    f += '重量：＿＿＿＿ kg';
    if (dest.estimated_weight_kg) f += '（概算 ' + dest.estimated_weight_kg + 'kg）';
    f += '\n';
    f += '保険入力 [' + insurance + ']\n';
  });

  if (data.notes) {
    f += '\n──────────────────────────\n';
    f += '備考：' + data.notes + '\n';
  }
  f += '──────────────────────────\n';

  document.getElementById('factoryMemo').innerText = f;

  // ── メール用テキスト ──
  let e = '';
  e += '出荷日：' + (shipDateStr || '＿＿月＿＿日') + '　→　納品日：' + delivDate + '\n\n';

  data.destinations.forEach(dest => {
    const shipType = dest.shipping_type === 'pallet' ? 'パレット' : 'バラ';
    e += '【' + dest.name + '宛】（' + shipType + '）\n';
    dest.items.forEach(item => {
      const formStr = item.form ? '（' + item.form + '）' : '';
      let csDetail = '';
      if (item.case_count && item.cs) {
        csDetail = '（' + item.case_count + '入×' + item.cs + '㌜）';
      } else if (item.cs) {
        csDetail = '（' + item.cs + '㌜）';
      }
      e += '◆' + item.name + formStr + '、' + item.quantity + '個' + csDetail + '\n';
      e += '　lot：＿＿＿＿\n';
    });
    e += '福山通運送り状番号：＿＿＿＿＿＿＿＿＿＿\n\n';
  });

  document.getElementById('emailText').textContent = e.trim();
  document.getElementById('outputArea').style.display = 'block';
  document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
}

// ─── ユーティリティ ───
function copyEmail() {
  const text = document.getElementById('emailText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'コピー済み';
    setTimeout(() => btn.textContent = 'コピー', 1500);
  });
}
function updateCharCount() {
  const len = document.getElementById('editInput').value.length;
  document.getElementById('charCount').textContent = len + '/200文字';
}
function updateEditCount() {
  document.getElementById('editCount').textContent = '修正回数：' + editCounter + '/' + MAX_EDITS;
}
function showLoading(id, show) { document.getElementById(id).style.display = show ? 'block' : 'none'; }
function showError(msg) { const el = document.getElementById('errorArea'); el.textContent = msg; el.style.display = 'block'; }
function hideError() { document.getElementById('errorArea').style.display = 'none'; }
function showInfo(msg) { const el = document.getElementById('infoArea'); el.textContent = msg; el.style.display = 'block'; }
function hideInfo() { document.getElementById('infoArea').style.display = 'none'; }

window.addEventListener('DOMContentLoaded', () => { loadApiKey(); });
