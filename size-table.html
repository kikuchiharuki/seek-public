<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サイズ表作成</title>
<style>
/* プレビューは出品先と同じ見え方にするため、リセットを掛けない（cellpaddingが効かなくなる） */
:where(:not(#preview *)){box-sizing:border-box;margin:0;padding:0}
:root{--bg:#e6e3dc;--card:#fff;--pri:#2d5016;--pri2:#4a7c28;--sub:#888;--bdr:#e0ddd8;--rad:4px}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:#1a1a1a;padding:20px 16px}
h1{font-size:18px;color:var(--pri);margin-bottom:14px}
h1 a{font-size:12px;font-weight:400;color:var(--sub);margin-left:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;max-width:1300px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
section{background:var(--card);border-radius:var(--rad);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:0}
h2{font-size:14px;color:var(--pri);margin:0 0 8px}
h2:not(:first-child){margin-top:18px}
.opts{display:flex;flex-direction:column;gap:12px;font-size:13px}
.opts fieldset{border:1px solid var(--bdr);border-radius:3px;padding:10px 12px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.opts legend{font-size:12px;font-weight:700;color:var(--pri);padding:0 6px;margin-left:-4px}
.opts label{display:flex;align-items:center;gap:6px}
.opts input[type=text],.opts input[type=number]{padding:4px 6px;border:1px solid var(--bdr);border-radius:6px}
.opts input[type=text]{width:12em}
.opts input[type=number]{width:4.5em}
.opts input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--bdr);border-radius:6px;background:none;cursor:pointer}
.opts select{padding:3px}
.opts label:has(:disabled){opacity:.4}
#grid{border-collapse:collapse;font-size:13px}
.gridwrap{display:flex;flex-direction:column}
.titlein{border:1px solid #bbb;border-bottom:0;padding:5px 6px;font:inherit;font-size:13px;font-weight:700;text-align:center;background:#f3f3f3;outline:none}
.titlein:focus{background:#fffbe0}
#grid td{border:1px solid #bbb;min-width:48px;padding:4px 6px;outline:none}
#grid td:focus{background:#fffbe0}
#grid tr:first-child td,#grid td:first-child{background:#f3f3f3}
.gridwrap{overflow-x:auto}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.edit{display:flex;align-items:flex-start;gap:8px}
.edit .gridwrap{min-width:0}
.colbtns{flex-direction:column;margin-top:0;flex-shrink:0}
.left{display:flex;flex-direction:column;gap:16px;min-width:0}
.right{position:sticky;top:16px;align-self:start} /* 左で編集中もプレビューが見えるように */
@media(max-width:860px){.right{position:static}}
button{padding:5px 10px;border:1px solid var(--bdr);border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
button:hover{border-color:var(--pri2)}
#copy{background:var(--pri2);color:#fff;border-color:var(--pri2);font-size:13px;padding:6px 14px;min-width:8.5em;transition:transform .08s,background .15s}
#copy:active{transform:scale(.94)}
#copy.done{background:var(--pri)}
#code.flash{animation:flash .6s}
@keyframes flash{from{background:#e3f0d6}to{background:#fff}}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
#preview{overflow-x:auto}
#code{width:100%;height:180px;font-family:Menlo,Consolas,monospace;font-size:12px;padding:8px;border:1px solid var(--bdr);border-radius:6px;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.row h2{flex-shrink:0}
.row h2{margin:0}
</style>
</head>
<body>
<h1>サイズ表作成<a href="index.html">← ツール一覧</a></h1>
<div class="cols">
 <div class="left">
 <section>
  <div class="row"><h2>表の中身</h2><p class="hint" style="margin:0">セルは直接書き換えられます。Excelの範囲は、タイトルのすぐ下の左端のセルに貼ると表ごと入ります。</p></div>
  <div class="edit">
   <div class="gridwrap"><input type="text" id="title" class="titlein" size="1" value="サイズ表(単位cm)" aria-label="タイトル"><table id="grid"></table></div>
   <div class="btns colbtns"><button data-act="addCol">＋列</button><button data-act="delCol">－列</button></div>
  </div>
  <div class="btns">
   <button data-act="addRow">＋行</button><button data-act="delRow">－行</button>
   <button data-act="clear" style="margin-left:auto">中身を空にする</button>
  </div>

  <h2>見た目</h2>
  <div class="opts">
   <fieldset><legend>タイトル</legend>
    <label>文字サイズ <input type="number" id="titleSize" min="1" max="4" step="0.2" value="1"></label>
    <label>背景 <input type="color" id="titleBg" value="#009900"></label>
    <label>文字 <input type="color" id="titleFg" value="#ffffff"></label>
    <label>枠の高さ <input type="number" id="titleH" min="20" max="80" step="2" value="28"> px</label>
   </fieldset>
   <fieldset><legend>表</legend>
    <label>背景 <input type="color" id="tableBg" value="#ece9d8"></label>
    <label>文字サイズ <input type="number" id="size" min="1.4" max="4" step="0.2" value="2"></label>
    <label>上下余白 <input type="number" id="pad" min="0" max="20" value="5"> px</label>
   </fieldset>
   <fieldset><legend>見出し</legend>
    <label>列見出し（1行目）背景 <input type="color" id="colBg" value="#ece9d8"></label>
    <label>文字 <input type="color" id="colFg" value="#000000"></label>
    <label>行見出し（1列目）背景 <input type="color" id="rowBg" value="#ece9d8"></label>
    <label>文字 <input type="color" id="rowFg" value="#000000"></label>
   </fieldset>
   <fieldset><legend>枠線</legend>
    <label><input type="checkbox" id="border"> 内側に線を引く</label>
    <label>色 <input type="color" id="borderColor" value="#999999" disabled></label>
   </fieldset>
  </div>
 </section>
 </div>
 <div class="left right">
 <section>
  <h2>プレビュー</h2>
  <div id="preview"></div>
 </section>
 <section>
  <div class="row"><h2>コード</h2><button id="copy">コピー</button></div>
  <textarea id="code" readonly></textarea>
  <p class="hint">出品ページの説明欄（HTML可の欄）に貼り付けてください。</p>
 </section>
 </div>
</div>
<script>
const $ = id => document.getElementById(id);
const grid = $('grid');
let data = [
 ['参考寸法','90cm','100cm','110cm','120cm','130cm','140cm'],
 ['着丈','40','45.5','48.5','52.5','56','60'],
 ['胸囲','72','76','80','84','88','92'],
 ['袖丈','31','35.3','39','42.8','46.5','50.3'],
 ['背肩幅','28','30.5','32','33.5','35','36.5'],
];
const PX = [0,10,13,16,18]; // font size 1〜4 の実際の大きさ
const fontPx = v => { const i = Math.min(3, Math.floor(v)); return +(PX[i] + (PX[i+1]-PX[i])*(v-i)).toFixed(1); };
// font size は整数しか効かないので、半端な値は近い整数＋px指定で出す（px指定が消されても整数側で表示される）
const fontAttr = (val, def) => { const v = Math.min(4, Math.max(1, +val || def)); return Number.isInteger(v) ? `"${v}"` : `"${Math.round(v)}" style="font-size:${fontPx(v)}px"`; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function drawGrid(){
 grid.innerHTML = data.map((r,i)=>'<tr>'+r.map((c,j)=>`<td contenteditable data-r="${i}" data-c="${j}">${esc(c)}</td>`).join('')+'</tr>').join('');
}
// 出品先でCSSが消えることがあるため、元の出品と同じ bgcolor / font タグ形式で出す
// th の font-size は、小さい文字が th の標準サイズの行の下側に寄るのを防ぐため（消されても見た目が少し下がるだけ）
function makeCode(){
 const cols = Math.max(...data.map(r=>r.length));
 const sz = fontAttr($('size').value, 2);
 // frame="void" rules="all" で外枠なし・内側の罫線だけ
 const bd = $('border').checked ? ` border="1" frame="void" rules="all" cellspacing="0" bordercolor="${$('borderColor').value}"` : '';
 const p = Math.max(0, parseInt($('pad').value) || 0), pad = ` cellpadding="${p}"`;
 // height は余白を含まないので、枠の高さから上下の余白を引く（文字より低い値にはならない）
 const tv = Math.min(4, Math.max(1, +$('titleSize').value || 1));
 const ht = ` height="${Math.max(fontPx(tv), (+$('titleH').value || 28) - 2*p)}"`;
 let h = `<table width="100%" bgcolor="${$('tableBg').value}"${bd}${pad}><tbody>`;
 h += `<tr><th colspan="${cols}" bgcolor="${$('titleBg').value}"${ht} align="center" style="font-size:${fontPx(tv)}px"><font color="${$('titleFg').value}" size=${fontAttr(tv, 1)}>${esc($('title').value)}</font></th></tr>`;
 // 見出しの色は、触ったものだけ出す（触っていなければ表の背景・黒文字のまま＝元の形）
 const set = id => $(id).dataset.touched ? $(id).value : '';
 const cell = (c, bg, fg) => `<td${bg ? ` bgcolor="${bg}"` : ''}><font${fg ? ` color="${fg}"` : ''} size=${sz}>${esc(c)}</font></td>`;
 data.forEach((r,i) => {
  h += '<tr>'+r.map((c,j) => i===0 ? cell(c, set('colBg'), set('colFg')) : j===0 ? cell(c, set('rowBg'), set('rowFg')) : cell(c)).join('')+'</tr>';
 });
 return h + '</tbody></table>';
}
function update(){ $('borderColor').disabled = !$('border').checked; const c = makeCode(); $('code').value = c; $('preview').innerHTML = c; }

grid.addEventListener('input', e => { const t=e.target; data[t.dataset.r][t.dataset.c] = t.innerText.trim(); update(); });
grid.addEventListener('paste', e => {
 const txt = e.clipboardData.getData('text/plain');
 if (!/[\t\n]/.test(txt.trim())) { e.preventDefault(); document.execCommand('insertText', false, txt.trim()); return; }
 e.preventDefault();
 const r0 = +e.target.dataset.r, c0 = +e.target.dataset.c;
 txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').forEach((line,i)=>{
  line.split('\t').forEach((v,j)=>{
   const r=r0+i, c=c0+j;
   while (data.length<=r) data.push(Array(data[0].length).fill(''));
   if (c>=data[0].length) data.forEach(row=>{ while(row.length<=c) row.push(''); });
   data[r][c] = v.trim();
  });
 });
 drawGrid(); update();
});
document.querySelector('.cols').addEventListener('click', e => {
 const a = e.target.dataset.act; if (!a) return;
 if (a==='addRow') data.push(Array(data[0].length).fill(''));
 if (a==='delRow' && data.length>1) data.pop();
 if (a==='addCol') data.forEach(r=>r.push(''));
 if (a==='delCol' && data[0].length>1) data.forEach(r=>r.pop());
 if (a==='clear') data = data.map((r,i)=>r.map((c,j)=>i&&j?'':c)); // 見出しの行・列は残す
 drawGrid(); update();
});
['title','titleBg','titleFg','titleH','titleSize','tableBg','size','pad','border','borderColor'].forEach(id=>$(id).addEventListener('input', update));
['colBg','colFg','rowBg','rowFg'].forEach(id=>$(id).addEventListener('input', e=>{ e.target.dataset.touched = 1; update(); }));
$('copy').addEventListener('click', async () => {
 try { await navigator.clipboard.writeText($('code').value); }
 catch { $('code').select(); document.execCommand('copy'); }
 const b = $('copy'), c = $('code'); b.textContent = '✓ コピーしました'; b.classList.add('done');
 c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); // 連続で押してももう一度光らせる
 clearTimeout(b._t); b._t = setTimeout(()=>{ b.textContent = 'コピー'; b.classList.remove('done'); }, 1500);
});
drawGrid(); update();
</script>
</body>
</html>
