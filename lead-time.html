const P=D.p,R=D.d;
let H={},HL=false;

async function init(){
 try{const r=await fetch("https://holidays-jp.github.io/api/v1/date.json");if(r.ok){H=await r.json();HL=true;for(let yr=2025;yr<=2030;yr++){if(!Object.keys(H).some(k=>k.startsWith(yr+'-')))genHol(yr)}}else fb()}catch(e){fb()}
 sd.value=nextBiz();ud();calc();
}
function fb(){
 // ルールベース祝日計算（2000-2099対応）
 // fallback: 2025-2030を確実にカバー
 for(let yr=2025;yr<=2030;yr++)genHol(yr);
 HL=true;
}
function genHol(y){
 const a=(d,n)=>{H[y+'-'+String(d).padStart(2,'0')+'-'+String(n).padStart(2,'0')]=1};
 const mon=(m,w)=>{// 第w月曜
  let d=new Date(y,m-1,1),c=0;
  while(c<w){if(d.getDay()===1)c++;if(c<w)d.setDate(d.getDate()+1)}
  return d.getDate()};
 // 春分・秋分（近似式、2000-2099）
 const se=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
 const ae=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
 // 固定祝日
 a(1,1);  // 元日
 a(2,11); // 建国記念の日
 a(2,23); // 天皇誕生日
 a(4,29); // 昭和の日
 a(5,3);  // 憲法記念日
 a(5,4);  // みどりの日
 a(5,5);  // こどもの日
 a(8,11); // 山の日
 a(11,3); // 文化の日
 a(11,23);// 勤労感謝の日
 // ハッピーマンデー
 a(1,mon(1,2));  // 成人の日
 a(7,mon(7,3));  // 海の日
 a(9,mon(9,3));  // 敬老の日
 a(10,mon(10,2));// スポーツの日
 // 春分・秋分
 a(3,se); a(9,ae);
 // 振替休日: 祝日が日曜なら翌月曜
 const ds=y+'-';
 Object.keys(H).filter(k=>k.startsWith(ds)).forEach(k=>{
  const d=new Date(k);
  if(d.getDay()===0){const nx=new Date(d);nx.setDate(nx.getDate()+1);H[fm(nx)]=1}
 });
 // 国民の休日: 祝日に挟まれた平日
 Object.keys(H).filter(k=>k.startsWith(ds)).forEach(k=>{
  const d=new Date(k);d.setDate(d.getDate()+2);const k2=fm(d);
  if(k2 in H){const mid=new Date(k);mid.setDate(mid.getDate()+1);const mk=fm(mid);if(!(mk in H)&&mid.getDay()!==0)H[mk]=1}
 });
}

const $=id=>document.getElementById(id);
const WD=['日','月','火','水','木','金','土'];
function fm(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dw(s){return WD[new Date(s).getDay()]}
function we(s){const w=new Date(s).getDay();return w===0||w===6}
function nb(s){return we(s)||(s in H)}

function pLT(c){const m=c.match(/^(\d+)(AM|PM)?$/);return m?{d:+m[1],t:m[2]||null}:null}

// カレンダー日で加算し、着日が非営業日なら翌営業日へ
function ca(sd,code){
 const lt=pLT(code);if(!lt)return null;
 let a=new Date(sd);
 a.setDate(a.getDate()+lt.d);
 let as=fm(a);
 // 着日が非営業日なら翌営業日
 const shifted=nb(as);
 while(nb(as)){a.setDate(a.getDate()+1);as=fm(a)}
 // 時間帯
 let tl,tc,altDate=null,altDow=null;
 if(lt.t){
  if(shifted){tl='午前中';tc='am'}  // 余裕あり→午前
  else{tl=lt.t==='AM'?'午前中':'午後';tc=lt.t==='AM'?'am':'pm'}
 }else{
  tl='日中着';tc='no';
  // 時間指定したい場合: 翌営業日午前
  let na=new Date(as);
  na.setDate(na.getDate()+1);
  let nas=fm(na);
  while(nb(nas)){na.setDate(na.getDate()+1);nas=fm(na)}
  altDate=nas;altDow=dw(nas);
 }
 return{date:as,dow:dw(as),time:tl,tc:tc,altDate:altDate,altDow:altDow}
}

const sp=$('sp'),sc=$('sc'),sd=$('sd');
P.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p;sp.appendChild(o)});
// デフォルト: 翌平日（今日が平日なら今日、休日なら次の平日）
function nextBiz(){let d=new Date();d.setDate(d.getDate()+1);let ds=fm(d);while(we(ds)||(ds in H)){d.setDate(d.getDate()+1);ds=fm(d)}return ds}

function ud(){
 const v=sd.value;if(!v)return;
 const d=dw(v);
 let h=d+'曜';
 if(v in H)h+='<span class="hb h">祝</span>';
 else if(we(v))h+='<span class="hb w">休</span>';
 $('dw').innerHTML=h;
}
sd.addEventListener('change',()=>{ud();calc()});

sp.addEventListener('change',()=>{
 const pi=sp.value;
 sc.innerHTML='<option value="">選択</option>';
 if(pi==='')return;
 const cs=[];R.forEach(r=>{if(r[0]==pi&&!cs.includes(r[1]))cs.push(r[1])});
 cs.sort();
 cs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sc.appendChild(o)});
 calc();
});
sc.addEventListener('change',calc);

function calc(){
 const pi=sp.value,ci=sc.value,sv=sd.value;
 const rc=$('rc'),ri=$('ri');
 if(!pi||!ci||!sv){rc.classList.add('hide');return}
 rc.classList.remove('hide');
 if(!HL){$('lm').classList.remove('hide');ri.classList.add('hide');return}
 $('lm').classList.add('hide');ri.classList.remove('hide');

 const ms=R.filter(r=>r[0]==pi&&r[1]===ci);
 if(!ms.length){$('ad').textContent='データなし';$('aw').textContent='';$('at').innerHTML='';$('li').textContent='';$('ni').textContent='';$('altInfo').classList.add('hide');$('ei').classList.add('hide');$('feeInfo').classList.add('hide');$('timeline').innerHTML='';return}

 const mn=ms.find(r=>!r[3]||r[3]==='');
 const exs=ms.filter(r=>r[3]&&r[3]!=='');
 const rec=mn||ms[0];
 const lt=rec[2],note=rec.length>4?rec[4]:'';
 const res=ca(sv,lt);
 if(!res){$('ad').textContent='エラー';return}
 const pl=pLT(lt);

 // タイムライン生成: 出荷日から着日まで
 const shipD=new Date(sv),arrD=new Date(res.date);
 const tl=$('timeline');tl.innerHTML='';
 let cur=new Date(shipD);
 while(cur<=arrD){
  const cs=fm(cur),d=document.createElement('div');
  d.className='tl-day';
  const isShip=cs===sv,isArr=cs===res.date;
  if(isShip)d.classList.add('ship');
  else if(isArr)d.classList.add('arr');
  else if(cs in H)d.classList.add('hol');
  else if(we(cs))d.classList.add('off');
  else d.classList.add('biz');
  let tag='';
  if(isShip)tag='<div class="tl-tag st">出荷</div>';
  else if(isArr)tag='<div class="tl-tag at">着日</div>';
  else if(cs in H)tag='<div class="tl-tag ht">祝</div>';
  else if(we(cs))tag='<div class="tl-tag" style="color:#94a3b8">休</div>';
  d.innerHTML='<div class="tl-md">'+(cur.getMonth()+1)+'/'+cur.getDate()+'</div><div class="tl-dw">'+dw(cs)+'</div>'+tag;
  tl.appendChild(d);
  cur.setDate(cur.getDate()+1);
 }

 // メイン結果
 $('ad').textContent=(arrD.getMonth()+1)+'/'+arrD.getDate();
 $('aw').textContent=res.dow+'曜日';
 $('at').innerHTML='<span class="mr-time '+res.tc+'">'+res.time+'</span>';
 $('li').textContent='LT: '+lt+'（出荷日+'+pl.d+'日）';
 $('ni').textContent=note?'⚠ '+note:'';

 // 時間指定代替表示
 if(res.altDate){
  const altD=new Date(res.altDate);
  $('altInfo').classList.remove('hide');
  $('altInfo').innerHTML='時間指定の場合 → <b>'+(altD.getMonth()+1)+'/'+altD.getDate()+'('+res.altDow+') 午前中〜</b>';
 }else{
  $('altInfo').classList.add('hide');
 }

 if(exs.length){
  $('ei').classList.remove('hide');
  let eh='<b>例外地区あり:</b><br>';
  exs.forEach(er=>{
   const eres=ca(sv,er[2]);
   if(eres){const ed=new Date(eres.date);eh+=er[3]+' → '+(ed.getMonth()+1)+'/'+ed.getDate()+'('+eres.dow+') '+eres.time;if(er.length>4&&er[4])eh+=' ⚠'+er[4];eh+='<br>'}
  });
  $('ei').innerHTML=eh;
 }else{$('ei').classList.add('hide')}

 // 別途手数料地域表示
 const fi=$('feeInfo');
 // メインが手数料地域か
 const mainFee=note==='別途手数料地域';
 // 例外地区で手数料のもの
 const excFee=ms.filter(r=>r[3]&&r[3]!==''&&r.length>4&&r[4]==='別途手数料地域');
 if(mainFee){
  fi.classList.remove('hide');
  fi.innerHTML='<span class="fee-all">⚠ 全域が別途手数料地域</span>';
  $('ni').textContent='';
 }else if(excFee.length){
  fi.classList.remove('hide');
  const areas=excFee.map(r=>r[3]).join('、');
  fi.innerHTML='<b>⚠ 別途手数料地域:</b> '+areas;
 }else{
  fi.classList.add('hide');
 }
}
