<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>製品画像 | シーク 社内ツール</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20fill=%22%231565C0%22/%3E%3Ctext%20x=%2250%22%20y=%2272%22%20font-size=%2270%22%20font-family=%22sans-serif%22%20font-weight=%22bold%22%20fill=%22%23fff%22%20text-anchor=%22middle%22%3ES%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--card:#fff;--pri:#2d5016;--pri2:#4a7c28;--txt:#1a1a1a;--sub:#888;--bdr:#e0ddd8;--rad:12px;--sh:0 2px 8px rgba(0,0,0,.06)}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:20px 16px 40px}
.w{max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:20px}
h1{font-size:20px;font-weight:800;color:var(--pri);letter-spacing:.06em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:4px;letter-spacing:0}
a.back{display:inline-block;margin-bottom:14px;font-size:13px;color:var(--pri2);text-decoration:none}
a.back:hover{text-decoration:underline}
.tools{display:flex;flex-direction:column;gap:10px}
a.tool{display:block;background:var(--card);border-radius:var(--rad);padding:18px;box-shadow:var(--sh);text-decoration:none;color:var(--txt);transition:transform .12s,box-shadow .12s;border:1.5px solid transparent}
a.tool:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1);border-color:var(--pri2)}
a.tool:active{transform:translateY(0)}
.tool-name{font-size:16px;font-weight:700;color:var(--pri);margin-bottom:4px}
.tool-desc{font-size:13px;color:var(--sub);line-height:1.5}
.tool-arrow{float:right;margin-top:6px;color:#ccc;font-size:18px}
.meta{margin:14px 0 4px;font-size:13px;color:var(--sub);line-height:1.6}
.meta b{color:var(--txt);font-weight:700}
h2{font-size:14px;font-weight:700;color:var(--pri);margin:26px 0 10px;padding-bottom:6px;border-bottom:1.5px solid var(--bdr)}
h2 span{float:right;font-size:11px;font-weight:400;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
figure{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
figure img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;background:#fafafa}
figcaption{font-size:12px;color:var(--sub);padding:8px 10px 10px;line-height:1.4}
figcaption a{color:var(--pri2);text-decoration:none;font-size:11px}
figcaption a:hover{text-decoration:underline}
.model{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
.model model-viewer{width:100%;height:340px;background:#fafafa;--poster-color:transparent}
.model .note{font-size:12px;color:var(--sub);padding:10px 12px;line-height:1.5}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .x{position:absolute;top:10px;right:14px;color:#fff;font-size:34px;line-height:1;background:none;border:0;cursor:pointer}
footer{text-align:center;margin-top:34px;font-size:11px;color:#bbb;line-height:1.7}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
 <a class="back" id="back" href="../index.html">‹ ツール一覧</a>
 <header><h1 id="title">製品画像<small id="sub">営業用の写真と3Dモデル</small></h1></header>

 <div id="list" class="tools"></div>

 <div id="detail" hidden>
  <div class="meta" id="meta"></div>

  <h2>実写 <span id="c1"></span></h2>
  <div class="grid" id="photos"></div>

  <h2>3Dモデル <span>回して見る / iPhoneはARで実寸表示</span></h2>
  <div id="model3d"></div>
 </div>

 <footer>© シーク静岡工場<br>製品は各メーカー様のものです。取り扱いにご注意ください。</footer>
</div>

<div id="lb"><button class="x" aria-label="閉じる">×</button><img alt=""></div>

<script>
// 製品を足すときはこの配列に1件追加する。画像は products/img/ に置く。
const PRODUCTS = [
 {
  id: "koukin-kukan",
  name: "特殊蒸発防止剤",
  maker: "ピュアライフホールディングス株式会社",
  spec: "1L ボトル / 1ケース10本入（ディスポカップ1個付）",
  note: "ケース外寸 約 477 × 209 × 260 mm",
  photos: [
   ["koukin-case-closed",  "ケース（閉・斜め）"],
   ["koukin-case-open",    "ケース（開・中身）"],
   ["koukin-bottle-front", "ボトル 正面"],
   ["koukin-bottle-back",  "ボトル 裏面"]
  ],
  model: "img/koukin-case.glb"
 }
];

const $ = s => document.querySelector(s);

function card(base, cap){
  const f = document.createElement("figure");
  const src = "img/" + base + ".jpg";
  f.innerHTML = `<img src="${src}" alt="${cap}" loading="lazy">
    <figcaption>${cap}<br><a href="${src}" download>ダウンロード</a></figcaption>`;
  f.querySelector("img").onclick = () => {
    $("#lb img").src = src;
    $("#lb").classList.add("on");
  };
  return f;
}

function fill(el, list){
  el.textContent = "";
  list.forEach(([b, c]) => el.append(card(b, c)));
}

let viewerLoaded = false;
function show3d(p){
  const box = $("#model3d");
  if (!p.model){ box.innerHTML = '<div class="model"><p class="note">この製品はまだ3Dモデルがありません。</p></div>'; return; }
  // 開いたら自動で表示する。モデルは軽く保つこと（数MBを超えるとスマホの回線でつらい）
  box.innerHTML = `<div class="model">
    <model-viewer src="${p.model}" alt="${p.name}" loading="eager" reveal="auto"
      camera-controls touch-action="pan-y" ar ar-modes="webxr scene-viewer quick-look"
      shadow-intensity="1" exposure="0.9"
      camera-orbit="218deg 68deg 1.5m" min-camera-orbit="auto auto 0.6m"></model-viewer>
    <p class="note">ドラッグで回転、ピンチで拡大。iPhone / Android では右下のARボタンで実寸のまま床に置けます。</p>
  </div>`;
  if (!viewerLoaded){
    const s = document.createElement("script");
    s.type = "module";
    s.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
    document.head.append(s);
    viewerLoaded = true;
  }
}

// 一覧（製品名だけ）。クリックすると #id が付いて詳細になる
function showList(){
  const el = $("#list");
  el.textContent = "";
  PRODUCTS.forEach(p => {
    const a = document.createElement("a");
    a.className = "tool";
    a.href = "#" + p.id;
    a.innerHTML = `<span class="tool-arrow">›</span>
      <div class="tool-name">${p.name}</div>
      <div class="tool-desc">${p.maker}</div>`;
    el.append(a);
  });
  $("#title").firstChild.textContent = "製品画像";
  $("#sub").textContent = "営業用の写真と3Dモデル";
  $("#back").href = "../index.html";
  $("#back").textContent = "‹ ツール一覧";
  $("#list").hidden = false;
  $("#detail").hidden = true;
  $("#model3d").textContent = "";      // 見えていない3Dは止めておく
}

function showDetail(p){
  $("#title").firstChild.textContent = p.name;
  $("#sub").textContent = p.maker;
  $("#back").href = "#";
  $("#back").textContent = "‹ 製品一覧";
  $("#meta").innerHTML = `${p.spec}${p.note ? "<br>" + p.note : ""}`;
  fill($("#photos"), p.photos);
  $("#c1").textContent = p.photos.length + "点";
  show3d(p);
  $("#list").hidden = true;
  $("#detail").hidden = false;
}

function route(){
  const p = PRODUCTS.find(x => x.id === location.hash.slice(1));
  p ? showDetail(p) : showList();
  scrollTo(0, 0);
}

addEventListener("hashchange", route);
route();

$("#lb").onclick = () => $("#lb").classList.remove("on");
addEventListener("keydown", e => { if (e.key === "Escape") $("#lb").classList.remove("on"); });
</script>
</body>
</html>
