<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シーク 社内ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--card:#fff;--pri:#2d5016;--pri2:#4a7c28;--txt:#1a1a1a;--sub:#888;--bdr:#e0ddd8;--rad:12px;--sh:0 2px 8px rgba(0,0,0,.06)}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:20px 16px}
.w{max-width:440px;margin:0 auto}
header{text-align:center;margin-bottom:28px}
h1{font-size:20px;font-weight:800;color:var(--pri);letter-spacing:.06em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:4px;letter-spacing:0}
.tools{display:flex;flex-direction:column;gap:10px}
a.tool{display:block;background:var(--card);border-radius:var(--rad);padding:18px 18px;box-shadow:var(--sh);text-decoration:none;color:var(--txt);transition:transform .12s,box-shadow .12s;border:1.5px solid transparent}
a.tool:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.1);border-color:var(--pri2)}
a.tool:active{transform:translateY(0)}
.tool-name{font-size:16px;font-weight:700;color:var(--pri);margin-bottom:4px}
.tool-desc{font-size:13px;color:var(--sub);line-height:1.5}
.tool-arrow{float:right;margin-top:6px;color:#ccc;font-size:18px}
footer{text-align:center;margin-top:32px;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="w">
 <header>
  <h1>シーク 社内ツール<small>株式会社シーク 静岡工場</small></h1>
 </header>
 <div class="tools">
  <a class="tool" href="csv-formatter/index.html">
   <span class="tool-arrow">›</span>
   <div class="tool-name">ピュアライフ出荷ツール</div>
   <div class="tool-desc">CSV/Excelを読み込み → 送り状CSV・Excel・メール文を一括生成。印刷対応</div>
  </a>
  <a class="tool" href="lead-time.html">
   <span class="tool-arrow">›</span>
   <div class="tool-name">リードタイム検索</div>
   <div class="tool-desc">福山通運 焼津支店発。出荷日・届け先から最短着日を計算</div>
  </a>
  <a class="tool" href="pdf-offset-tool.html">
   <span class="tool-arrow">›</span>
   <div class="tool-name">送り状用紙節約</div>
   <div class="tool-desc">福山通運 is-x 送り状用紙専用。使用済み用紙を再利用するためのPDFオフセットツール</div>
  </a>
  <a class="tool" href="form-label-a4.html">
   <span class="tool-arrow">›</span>
   <div class="tool-name">カートン小札ラベル</div>
   <div class="tool-desc">A4用紙に10面。各セルに直接入力してそのまま印刷</div>
  </a>
  <a class="tool" href="https://chatgpt.com/g/g-p-698dc10e7dcc81919b89697a8e991118-sikuai/project" target="_blank" rel="noopener">
   <span class="tool-arrow">↗</span>
   <div class="tool-name">シークAI（ChatGPT）</div>
   <div class="tool-desc">発注書PDFをアップして「出荷メモ作成」と送信。工場用メモとメール文を生成</div>
  </a>
 </div>
 <footer>© シーク静岡工場</footer>
</div>
</body>
</html>
