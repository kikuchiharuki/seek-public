<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カートン小札用ラベル用紙</title>
<!-- ファビコン: 青地に白の「S」(Liberation Sans BoldのアウトラインをSVGパス化・画像ファイル不要) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20fill=%22%231565C0%22/%3E%3Cg%20transform=%22translate(50%2050)%20scale(0.04276%20-0.04276)%20translate(-672.5%20-705.0)%22%3E%3Cpath%20d=%22M1286%20406Q1286%20199%201132.5%2089.5Q979%20-20%20682%20-20Q411%20-20%20257.0%2076.0Q103%20172%2059%20367L344%20414Q373%20302%20457.0%20251.5Q541%20201%20690%20201Q999%20201%20999%20389Q999%20449%20963.5%20488.0Q928%20527%20863.5%20553.0Q799%20579%20616%20616Q458%20653%20396.0%20675.5Q334%20698%20284.0%20728.5Q234%20759%20199.0%20802.0Q164%20845%20144.5%20903.0Q125%20961%20125%201036Q125%201227%20268.5%201328.5Q412%201430%20686%201430Q948%201430%201079.5%201348.0Q1211%201266%201249%201077L963%201038Q941%201129%20873.5%201175.0Q806%201221%20680%201221Q412%201221%20412%201053Q412%20998%20440.5%20963.0Q469%20928%20525.0%20903.5Q581%20879%20752%20842Q955%20799%201042.5%20762.5Q1130%20726%201181.0%20677.5Q1232%20629%201259.0%20561.5Q1286%20494%201286%20406Z%22%20fill=%22%23fff%22/%3E%3C/g%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #f0ede8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px;
  gap: 16px;
}

h1 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #888;
}

.print-btn {
  padding: 10px 32px;
  background: #2a6b3a;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.05em;
}
.print-btn:hover { background: #225530; }
.print-btn:active { transform: scale(0.98); }

.hint {
  font-size: 11px;
  color: #aaa;
  text-align: center;
  line-height: 1.8;
}

.sheet-outer {
  width: 620px;
  height: 876px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.13);
}

.sheet {
  width: 210mm;
  height: 297mm;
  background: #e8e8e8;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(5, 1fr);
  gap: 0.3mm;
  transform-origin: top left;
  transform: scale(0.781);
}

textarea {
  background: #fff;
  border: none;
  outline: none;
  resize: none;
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  font-size: 14pt;
  color: #111;
  line-height: 1.4;
  padding: 6mm;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

textarea:focus { background: rgba(44,95,138,0.04); }

/* ============ PRINT ============ */
@media print {
  @page {
    size: 210mm 297mm portrait;
    margin: 0;
  }

  body { background: white; padding: 0; display: block; }
  h1, .print-btn, .hint { display: none; }

  .sheet-outer {
    width: 210mm;
    height: 297mm;
    box-shadow: none;
    overflow: visible;
  }

  .sheet {
    transform: none;
    background: white;
    gap: 0;
  }

  textarea {
    background: white !important;
    -webkit-print-color-adjust: exact;
    overflow: hidden;
  }
}
</style>
</head>
<body>

<h1>【カートン小札用】ラベル用紙 10面 A4</h1>

<button class="print-btn" onclick="window.print()">印刷 / PDF保存</button>

<div class="sheet-outer">
  <div class="sheet">
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
    <textarea></textarea>
  </div>
</div>

<p class="hint">各セルに直接入力（7行まで） → 印刷ボタンでPDF保存または印刷</p>

<script>
const MAX_LINES = 7;
document.querySelectorAll('textarea').forEach(ta => {
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (ta.value.split('\n').length >= MAX_LINES) e.preventDefault();
    }
  });
  ta.addEventListener('input', () => {
    const lines = ta.value.split('\n');
    if (lines.length > MAX_LINES) {
      ta.value = lines.slice(0, MAX_LINES).join('\n');
    }
  });
});
</script>

</body>
</html>
